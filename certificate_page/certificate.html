<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Certificate of Completion</title>

<style>

* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    position:fixed;
    overflow:hidden;
    overscroll-behavior:none;
    background:#0a0e16;
    font-family:Arial, sans-serif;
    -webkit-user-select:none;
    user-select:none;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    display:block;
    touch-action:none;
}

#stage{
    position:relative;
    z-index:10;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    gap:10px;
}

#seal{
    width:min(360px, 34vh, 40vw);
    filter:drop-shadow(0 0 26px rgba(255,196,60,0.55)) drop-shadow(0 8px 18px rgba(0,0,0,0.6));
    animation: floatSeal 4.5s ease-in-out infinite;
}

@keyframes floatSeal{
    0%,100%{ transform:translateY(0px); }
    50%{ transform:translateY(-10px); }
}

#titleBlock{
    text-align:center;
}

#eyebrow{
    color:#7fd8ff;
    font-size:14px;
    font-weight:700;
    letter-spacing:4px;
    text-shadow:1px 1px 3px black;
}

#title{
    margin:4px 0 2px 0;
    font-size:clamp(24px, 3.4vw, 40px);
    font-weight:900;
    letter-spacing:2px;
    background:linear-gradient(180deg, #fff3c4 0%, #ffd24a 45%, #c98a1f 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 2px 10px rgba(255,180,40,0.35);
}

#subtitle{
    color:#cfeeff;
    font-size:15px;
    font-weight:600;
    text-shadow:1px 1px 3px black;
}

#card{
    background:rgba(10,16,24,0.72);
    border:2px solid #ffcf6b;
    border-radius:18px;
    padding:16px 26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    box-shadow:0 0 30px rgba(255,196,60,0.15), inset 0 0 40px rgba(0,0,0,0.35);
    max-width:92vw;
}

#stagesRow{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
}

.stageChip{
    background:rgba(0,255,140,0.12);
    border:1px solid #33d17a;
    color:#c9ffe0;
    font-size:12.5px;
    font-weight:700;
    padding:6px 12px;
    border-radius:999px;
    white-space:nowrap;
}
.stageChip .tick{ color:#00ff8c; margin-right:4px; }

#gradeRow{
    display:flex;
    align-items:center;
    gap:22px;
}

#gradeMedallion{
    width:78px;
    height:78px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff3c4, #ffd24a 45%, #a8721a 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    font-weight:900;
    color:#3a2400;
    box-shadow:0 0 22px rgba(255,196,60,0.6), inset 0 -4px 8px rgba(0,0,0,0.25);
    border:3px solid #7a5011;
}

#statsCol{
    text-align:left;
    color:#eafcff;
}
#statsCol div{ font-size:14px; margin:2px 0; }
#statsCol .k{ color:#ffbf6b; font-weight:700; }

#serial{
    color:#8fa2b3;
    font-size:11.5px;
    letter-spacing:1px;
}

#menuBtn{
    margin-top:4px;
    width:260px;
    height:62px;
    border:none;
    border-radius:14px;
    background:#00ff88;
    color:#06210f;
    font-size:20px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 4px 0 #00a85c;
    touch-action:none;
}
#menuBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #00a85c; }

body.touch #menuBtn{ width:300px; height:74px; font-size:23px; }
body.touch #title{ font-size:clamp(26px,4vw,44px); }
body.touch #card{ padding:20px 32px; }

@media (max-height: 700px){
    #seal{ width:min(240px, 28vh, 34vw); }
    #card{ padding:12px 20px; gap:8px; }
}

</style>
</head>
<body>

<canvas id="fx"></canvas>

<div id="stage">
    <img id="seal" src="production_certificate.png" alt="Certificate seal">

    <div id="titleBlock">
        <div id="eyebrow">QUALITY ASSURED · FACTORY LINE 01</div>
        <h1 id="title">Certificate of Completion</h1>
        <div id="subtitle">Automotive Engine Production — All Stages Passed</div>
    </div>

    <div id="card">
        <div id="stagesRow">
            <div class="stageChip"><span class="tick">✔</span>Raw Material</div>
            <div class="stageChip"><span class="tick">✔</span>Casting</div>
            <div class="stageChip"><span class="tick">✔</span>Machining</div>
            <div class="stageChip"><span class="tick">✔</span>Assembly</div>
            <div class="stageChip"><span class="tick">✔</span>Testing</div>
        </div>

        <div id="gradeRow">
            <div id="gradeMedallion">A</div>
            <div id="statsCol">
                <div><span class="k">Score</span> <span id="scoreVal">—</span></div>
                <div><span class="k">Completed</span> <span id="dateVal">—</span></div>
            </div>
        </div>

        <div id="serial">Certificate No. <span id="serialVal">—</span></div>
    </div>

    <button id="menuBtn">RETURN TO MENU</button>
</div>

<script>

/* =====================
   Where "Return to Menu" should go.
   Adjust this path to match your project's folder structure.
===================== */
const MENU_URL = "https://iemanzah4ri.github.io/PEMSB-GAME/index.html";
/* =====================
   KIOSK / TOUCHSCREEN GUARDS
===================== */

const IS_TOUCH = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
if(IS_TOUCH) document.body.classList.add("touch");

document.addEventListener("gesturestart", e=>e.preventDefault());
document.addEventListener("gesturechange", e=>e.preventDefault());
document.addEventListener("contextmenu", e=>e.preventDefault());

let lastTouchEnd = 0;
document.addEventListener("touchend", (e)=>{
    const now = Date.now();
    if(now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
}, {passive:false});

document.addEventListener("touchmove", (e)=>{ e.preventDefault(); }, {passive:false});

let lastInteraction = performance.now();
function markInteraction(){ lastInteraction = performance.now(); }
["mousedown","touchstart","keydown"].forEach(evt=>{
    window.addEventListener(evt, markInteraction, {passive:true});
});

// Kiosk attract-mode: return to the menu on its own if left unattended
const IDLE_RETURN_MS = 30000;
setInterval(()=>{
    if(performance.now() - lastInteraction > IDLE_RETURN_MS) goToMenu();
}, 1000);

/* =====================
   FILL IN RESULTS FROM THE PREVIOUS STAGE
   Pass ?grade=S&score=980 (and optionally &serial=...) when redirecting
   here from the final stage. Sensible defaults are shown if absent.
===================== */

const params = new URLSearchParams(window.location.search);

const storedScore = localStorage.getItem("finalScore");
const storedGrade = localStorage.getItem("finalGrade");
const storedSerial = localStorage.getItem("finalSerial");

const grade = storedGrade || "A";
const serial = storedSerial || params.get("serial") ||
    ("ENG-" + new Date().getFullYear() + "-" + String(Date.now()).slice(-6));

document.getElementById("gradeMedallion").innerText = grade;
document.getElementById("scoreVal").innerText = storedScore || "0";
document.getElementById("dateVal").innerText = new Date().toLocaleDateString(undefined, {
    year:"numeric", month:"long", day:"numeric"
});
document.getElementById("serialVal").innerText = serial;
const gradeColors = {
    S:["#fff3c4","#ffd24a","#a8721a"],
    A:["#e9fff2","#7fffb0","#1f9e5a"],
    B:["#eaf6ff","#7fd8ff","#1f6f9e"],
    C:["#fff0ea","#ff9d7f","#9e3f1f"]
};
const gc = gradeColors[grade] || gradeColors.A;
document.getElementById("gradeMedallion").style.background =
    `radial-gradient(circle at 35% 30%, ${gc[0]}, ${gc[1]} 45%, ${gc[2]} 100%)`;

/* =====================
   RETURN TO MENU
===================== */

function goToMenu(){
    window.location.href = MENU_URL;
}

document.getElementById("menuBtn").addEventListener("click", (e)=>{
    e.preventDefault();
    markInteraction();
    goToMenu();
});
document.getElementById("menuBtn").addEventListener("touchend", (e)=>{
    e.preventDefault();
    markInteraction();
    goToMenu();
}, {passive:false});

/* =====================
   CELEBRATION BACKGROUND
===================== */

const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");
const bg = new Image();
bg.src = "factory_background.png";

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", ()=>setTimeout(resize,300));

const confetti = [];
const COLORS = ["#ffd24a","#7fd8ff","#00ff8c","#ff9d7f","#ffffff"];

function spawnConfetti(){
    confetti.push({
        x: Math.random()*canvas.width,
        y: -20,
        size: 3 + Math.random()*4,
        speed: 0.6 + Math.random()*1.4,
        drift: (Math.random()-0.5)*0.6,
        spin: Math.random()*Math.PI*2,
        spinSpeed: (Math.random()-0.5)*0.15,
        color: COLORS[Math.floor(Math.random()*COLORS.length)]
    });
}

let spawnTimer = 0;

function drawBackground(){
    if(bg.complete && bg.naturalWidth>0){
        const scale = Math.max(canvas.width/bg.width, canvas.height/bg.height);
        const w = bg.width*scale, h = bg.height*scale;
        ctx.drawImage(bg, canvas.width/2-w/2, canvas.height/2-h/2, w, h);
    } else {
        ctx.fillStyle = "#121824";
        ctx.fillRect(0,0,canvas.width,canvas.height);
    }
    ctx.fillStyle = "rgba(6,10,18,0.62)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
}

function update(){
    spawnTimer++;
    if(spawnTimer > 6){
        spawnTimer = 0;
        spawnConfetti();
    }

    drawBackground();

    for(let i=confetti.length-1;i>=0;i--){
        const c = confetti[i];
        c.y += c.speed;
        c.x += c.drift;
        c.spin += c.spinSpeed;

        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.spin);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.size/2, -c.size/2, c.size, c.size);
        ctx.restore();

        if(c.y > canvas.height+20) confetti.splice(i,1);
    }

    if(confetti.length > 220) confetti.splice(0, confetti.length-220);

    requestAnimationFrame(update);
}
requestAnimationFrame(update);

</script>
</body>
</html>
