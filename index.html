<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Engine Life Cycle</title>
        <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Offline Service Worker Registered'))
        .catch(err => console.log('Service Worker Failed', err));
    });
  }
</script>
        <style>
            body{
                margin:0;
                height:100vh;

                display:flex;
                justify-content:center;
                align-items:center;

                font-family:Arial, Helvetica, sans-serif;

                background-image:url("menu_background.png");
                background-size:cover;
                background-position:center;
                background-repeat:no-repeat;
}
            .menu-container{

                text-align:center;

                background:rgba(0,0,0,0.65);

                padding:40px;

                border-radius:25px;

                backdrop-filter:blur(6px);

                box-shadow:
                0 0 30px rgba(0,210,255,0.4);

            }
            .stage-grid{

                display:grid;

                grid-template-columns:
                repeat(3,1fr);

                gap:20px;

                margin-top:30px;

            }

            .stage-card{

                position:relative;

                width:220px;

                height:160px;

                overflow:hidden;

                border-radius:20px;

                cursor:pointer;

                transition:.3s;

                box-shadow:
                0 0 15px rgba(0,210,255,.4);

            }

            .stage-card:hover{

                transform:scale(1.05);

                box-shadow:
                0 0 25px #00d2ff;

            }

            .stage-card img{

                width:100%;
                height:100%;

                object-fit:cover;

            }

            .stage-label{

                position:absolute;

                left:0;
                right:0;
                bottom:0;

                padding:10px;

                background:
                rgba(0,0,0,.75);

                color:white;

                font-weight:bold;

                text-align:center;

            }
            h1{
                color:#00d2ff;

                font-size:72px;

                text-shadow:
                0 0 15px #00d2ff;
            }
            .subtitle{
                color:white;
                margin-bottom:40px;
                font-size:20px;
            }
            .menu-btn{

                display:block;

                width:380px;

                margin:15px auto;

                padding:20px;

                font-size:22px;

                font-weight:bold;

                border:none;

                border-radius:18px;

                background:
                linear-gradient(
                90deg,
                #0077ff,
                #00d2ff
                );

                color:white;

                cursor:pointer;

                transition:0.3s;

            }
            .menu-btn:hover{

                transform:
                scale(1.05);

                box-shadow:
                0 0 20px #00d2ff;

            }
            .locked{
                background:#555;
                cursor:not-allowed;
            }

            .footer{
                margin-top: 30px;
                color: #999;
                font: size 14px;
            }
        </style>
    </head>

    <body>
        <div class="menu-container">
            <h1>ENGINE LIFE CYCLE</h1>
            <div class="subtitle">
                Follow the journey from raw material to finished engine.
            </div>

            <div class="stage-grid">

    <div class="stage-card"
    onclick="window.location='stage1/stage1.html'">

        <img src="stage1.png" alt="Stage 1">

        <div class="stage-label">

            STAGE 1<br>
            RAW MATERIALS

        </div>

    </div>

    <div class="stage-card"
    onclick="window.location='stage2/stage2.html'">

        <img src="stage2.png" alt="Stage 2">

        <div class="stage-label">

            STAGE 2<br>
            CASTING

        </div>

    </div>

    <div class="stage-card"
    onclick="window.location='stage3/stage3.html'">

        <img src="stage3.png" alt="Stage 3">

        <div class="stage-label">

            STAGE 3<br>
            MACHINING

        </div>

    </div>

    <div class="stage-card"
    onclick="window.location='stage4/stage4.html'">

        <img src="stage4.png" alt="Stage 4">

        <div class="stage-label">

            STAGE 4<br>
            ASSEMBLY

        </div>

    </div>


    <div class="stage-card" onclick ="window.location='stage5/stage5.html'">

        <img src="testing.png" alt="testing">

        <div class="stage-label">

            FINALE<br>
            TESTING

        </div>

    </div>

</div>




            <div class="footer">
                PEMSB Engine Storytelling Game
            </div>
        </div>
    </body>
</html>
