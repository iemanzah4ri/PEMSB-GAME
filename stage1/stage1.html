<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Engine Life Cycle - Stage 1</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#121824;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#message{
    position:absolute;
    top:20px;
    left:20px;

    color:#00d2ff;

    font-size:24px;
    font-weight:bold;

    z-index:100;
}

#story{
    position:absolute;
    top:60px;
    left:20px;

    color:white;
    font-size:18px;

    z-index:100;
}

#beginBtn{

    margin-top:20px;

    width:280px;

    height:60px;

    border:none;

    border-radius:15px;

    background:#00ff88;

    color:black;

    font-size:24px;

    font-weight:bold;

    cursor:pointer;

}

#introPopup{

    position:fixed;

    left:0;
    top:0;

    width:100%;
    height:100%;

    background:
    rgba(0,0,0,0.8);

    display:flex;

    justify-content:center;
    align-items:center;

    z-index:5000;

}

#popupContainer{

    position:relative;

    width:650px;

}

#popupBg{

    width:100%;

}

#popupContent{

    position:absolute;

    top:120px;

    left:170px;

    right:170px;

    bottom:140px;

    text-align:center;

    color:white;

}

</style>

</head>

<body>

<div id="message">
Score: 0 | Aluminium Collected: 0 | Plastic Collected: 0 |Scrap Collected: 0
</div>

<div id="story">
Stage 1: Collect aluminium to create an engine block.
</div>

<div id="introPopup">

    <div id="popupContainer">

    <img
    id="popupBg"
    src="popup.png">

    <div id="popupContent">

            <h1>WORK ORDER #01</h1>

            <h2>COLLECT RAW MATERIAL</h2>

            <p>

                Collect all materials until points 
                100 to go to the next level.

            </p>

            <ul>

                <li>Aluminium 10pts</li>
                <li>Scrap -5pts</li>
                <li>Plastic -10pts</li>

            </ul>

            <button id="beginBtn">

                START OPERATION

            </button>

        </div>

    </div>

</div>

<canvas id="game"></canvas>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

window.addEventListener(
"resize",
()=>{
    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;
}
);

/* ====================
   GAME STATE
==================== */

let score = 0;
let aluminiumcollected = 0;
let plasticcollected = 0;
let scrapcollected = 0;
let gameFinished = false;

/* ====================
   IMAGES
==================== */

const bg = new Image();
bg.src =
"stage1_background.png";

const aluminiumImg =
new Image();

aluminiumImg.src =
"aluminium.png";

const scrapImg =
new Image();

scrapImg.src =
"scrap.png";

const plasticImg =
new Image();

plasticImg.src =
"plastic.png";

const backgroundSound =
new Audio("stage1soundtrack.mp3");

backgroundSound.preload = "auto";
backgroundSound.loop = true;
backgroundSound.volume = 0.35;

let audioContext = null;

function startBackgroundSound(){
    if(!audioContext){
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }

    backgroundSound.currentTime = 0;
    backgroundSound.play().catch(error => {
        console.error("Stage 1 soundtrack could not play:", error);
    });
}

function playCollectSound(type){
    if(!audioContext){
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const now = audioContext.currentTime;
    const isAluminium = type === "aluminium";

    oscillator.type = isAluminium ? "sine" : "square";
    oscillator.frequency.setValueAtTime(isAluminium ? 880 : 180, now);
    oscillator.frequency.exponentialRampToValueAtTime(isAluminium ? 1320 : 90, now + 0.12);
    gain.gain.setValueAtTime(0.16, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start(now);
    oscillator.stop(now + 0.12);
}

/* ====================
   MATERIALS
==================== */

const materials = [];

function createMaterial(){

    const types = [

    {
        type:"aluminium",
        image:aluminiumImg,
        score:10
    },

    {
        type:"scrap",
        image:scrapImg,
        score:-5
    },

    {
        type:"plastic",
        image:plasticImg,
        score:-10
    }

    ];

    const chosen =
    types[
        Math.floor(
            Math.random()*
            types.length
        )
    ];

    return{

        x:
        Math.random()*
        (canvas.width-100),

        y:-100,

        width:90,
        height:90,

        speed:
        2 +
        Math.random()*3,

        ...chosen

    };

}

for(let i=0;i<8;i++){

    materials.push(
        createMaterial()
    );

}

/* ====================
   DRAW MATERIAL
==================== */

function drawMaterial(material){

    ctx.drawImage(

        material.image,

        material.x,
        material.y,

        material.width,
        material.height

    );

}

/* ====================
   COLLECT
==================== */

function collect(x,y){

    if(gameFinished)
    return;

    materials.forEach(material=>{

        if(

            x >= material.x &&
            x <= material.x +
            material.width &&

            y >= material.y &&
            y <= material.y +
            material.height

        ){

            score +=
            material.score;

            playCollectSound(material.type);

            if(
                material.type ===
                "aluminium"
            ){
                aluminiumcollected++;
            }

            if(
                material.type ===
                "plastic"
            ){
                plasticcollected++;
            }

            if(
                material.type ===
                "scrap"
            ){
                scrapcollected++;
            }

            document
            .getElementById("message")
            .innerText =

            `Score: ${score} | Aluminium Collected: ${aluminiumcollected} | Scrap Colleted: ${scrapcollected} | Platic Collected: ${plasticcollected}`;

            material.y = -100;

            material.x =
            Math.random()*
            (canvas.width-100);

            if(
                score >= 100
            ){

                gameFinished =
                true;

                document
                .getElementById("story")
                .innerText =

                "Raw material collected successfully. Engine block production begins.";

                setTimeout(()=>{

                    window.location.href =
                    "../stage2/stage2.html";

                },2000);

            }

        }

    });

}

/* ====================
   EVENTS
==================== */
document
.getElementById("beginBtn")
.addEventListener(
    "click",
e=>{
    startBackgroundSound();
    document
    .getElementById("introPopup")
    .style.display =
    "none";
});

canvas.addEventListener(
"click",
e=>{

    collect(
        e.clientX,
        e.clientY
    );

}
);

canvas.addEventListener(
"touchstart",
e=>{

    const touch =
    e.touches[0];

    collect(

        touch.clientX,
        touch.clientY

    );

},
{passive:true}
);

/* ====================
   LOOP
==================== */

function update(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /* BACKGROUND */

    ctx.drawImage(
        bg,
        0,
        0,
        canvas.width,
        canvas.height
    );

    if(!gameFinished){

        materials.forEach(material=>{

            material.y +=
            material.speed;

            if(
                material.y >
                canvas.height
            ){

                Object.assign(

                    material,

                    createMaterial()

                );

            }

            drawMaterial(
                material
            );

        });

    }

    if(gameFinished){

        ctx.fillStyle =
        "#00ff99";

        ctx.font =
        "50px Arial";

        ctx.fillText(

            "ENGINE BLOCK CREATED!",

            canvas.width/2 - 280,

            canvas.height/2

        );

        ctx.font =
        "28px Arial";

        ctx.fillText(

            "Stage 1 Complete",

            canvas.width/2 - 100,

            canvas.height/2 + 60

        );

    }

    requestAnimationFrame(
        update
    );

}

update();

</script>

</body>
</html>
